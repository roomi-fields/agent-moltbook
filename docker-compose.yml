# Docker Compose for OpenClaw agent on the second PC (WSL2)
# Isolated container with restricted network access

services:
  openclaw-agent:
    image: node:22-alpine
    container_name: openclaw-agent
    working_dir: /app
    volumes:
      - ./:/app
      - ~/.openclaw:/root/.openclaw
      - ~/.config/codex:/root/.config/codex
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    command: >
      sh -c "
        npm install -g openclaw @openai/codex &&
        openclaw start
      "
    restart: unless-stopped
    networks:
      - agent-restricted

networks:
  agent-restricted:
    driver: bridge
    # Note: For full network restriction, use iptables rules
    # to only allow outbound to:
    # - api.moltbook.com
    # - generativelanguage.googleapis.com
    # - github.com
    # - api.openai.com
